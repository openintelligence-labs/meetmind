[package]
name = "meetmind"
version = "0.13.0"
edition = "2021"
authors = ["Open Intelligence Labs"]
license = "MIT"
description = "MeetMind — local-first meeting assistant (overlay shell)"

[lib]
name = "meetmind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
